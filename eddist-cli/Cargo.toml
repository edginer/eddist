[package]
name = "eddist-cli"
version = "0.1.0"
edition = "2024"

[features]
default = []
backend-postgres = []

[dependencies]
anyhow.workspace = true
# `sqlx-mysql` comes from the workspace dependency; the CLI migration also
# connects to PostgreSQL, so add its SeaORM driver here.
sea-orm = { workspace = true, features = ["sqlx-postgres"] }
clap.workspace = true
eddist-core.workspace = true
futures.workspace = true
dotenvy.workspace = true
aws-sdk-s3.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
