name: Build eddist-all (postgres)

on:
  push:
    branches:
      - feat/postgres-migration

jobs:
  build-eddist-pg:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    env:
      VITE_EDDIST_ADMIN_AUTH_SERVER_URL: ${{ secrets.VITE_EDDIST_ADMIN_AUTH_SERVER_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Rust
        uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c # v2.0.1
      - name: Load cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pg-${{ hashFiles('**/Cargo.lock') }}
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        name: Install pnpm
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            eddist-server/client-v2/pnpm-lock.yaml
            eddist-admin/client/pnpm-lock.yaml
      - name: Install pnpm dependencies
        run: pnpm install
      - name: Build eddist-client-v2
        run: pnpm -F eddist-client-v2 build
      - name: Build eddist-admin-client
        run: pnpm -F eddist-admin-client build
      - name: Build (postgres backend)
        run: |
          cargo build --release \
            -p eddist \
            -p eddist-admin \
            -p eddist-cron \
            -p eddist-persistence \
            -p eddist-cli \
            --features eddist/backend-postgres,eddist-persistence/backend-postgres,eddist-cli/backend-postgres
      - name: rm .dockerignore
        run: rm .dockerignore
      - name: Login to Docker registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (eddist)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker-prod/eddist/Dockerfile
          push: true
          tags: |
            ghcr.io/edginer/eddist:${{ github.sha }}-pg
            ghcr.io/edginer/eddist:latest-pg
      - name: Build and push Docker image (eddist-admin)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker-prod/eddist-admin/Dockerfile
          push: true
          tags: |
            ghcr.io/edginer/eddist-admin:${{ github.sha }}-pg
            ghcr.io/edginer/eddist-admin:latest-pg
      - name: Build and push Docker image (eddist-cron)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker-prod/eddist-cron/Dockerfile
          push: true
          tags: |
            ghcr.io/edginer/eddist-cron:${{ github.sha }}-pg
            ghcr.io/edginer/eddist-cron:latest-pg
      - name: Build and push Docker image (eddist-persistence)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker-prod/eddist-persistence/Dockerfile
          push: true
          tags: |
            ghcr.io/edginer/eddist-persistence:${{ github.sha }}-pg
            ghcr.io/edginer/eddist-persistence:latest-pg
      - name: Build and push Docker image (eddist-cli)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker-prod/eddist-cli/Dockerfile
          push: true
          tags: |
            ghcr.io/edginer/eddist-cli:${{ github.sha }}-pg
            ghcr.io/edginer/eddist-cli:latest-pg
